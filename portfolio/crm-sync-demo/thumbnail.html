<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portfolio thumbnail</title>
<style>
  :root{--ink:#1f2933;--muted:#5f6c7b;--paper:#fbfaf7;--accent:#2f6fb3;--guard:#b4452f;--c1:#e8f1fb;--c2:#eaf6ee;--c3:#fdf3e1;--c4:#f1ecfa;--c5:#fbebea;--c6:#e6f4f5}
  *{box-sizing:border-box;margin:0}
  html,body{width:100vw;height:100vh;background:var(--paper);color:var(--ink);font-family:"DejaVu Sans","Helvetica Neue",Arial,sans-serif;overflow:hidden}
  .wrap{width:100%;height:100%;padding:8vmin 9vmin;display:flex;flex-direction:column;justify-content:center;gap:4.2vmin}
  .tag{align-self:flex-start;background:var(--c1);color:var(--accent);border-radius:1vmin;padding:.9vmin 2.2vmin;font-size:2.4vmin;font-weight:700;letter-spacing:.25vmin;text-transform:uppercase}
  h1{font-size:8.6vmin;line-height:1.08;letter-spacing:-.2vmin}
  .sub{font-size:3.3vmin;color:var(--muted);line-height:1.3}
  .stats{display:flex;gap:2.6vmin}
  .stat{flex:1;border:.5vmin solid var(--ink);border-radius:2vmin;padding:2.6vmin 2.4vmin;background:#fff}
  .stat b{display:block;font-size:10vmin;line-height:1;letter-spacing:-.3vmin}
  .stat span{display:block;margin-top:1.2vmin;font-size:2.6vmin;color:var(--muted)}
  .flow{display:flex;gap:1.2vmin;align-items:center}
  .dot{flex:1;height:1.6vmin;border-radius:1vmin;border:.35vmin solid var(--ink)}
  .d1{background:var(--c1)}.d2{background:var(--c2)}.d3{background:var(--c3)}.d4{background:var(--c4)}.d5{background:var(--c5)}.d6{background:var(--c6)}
  .foot{font-size:2.5vmin;color:var(--muted)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="tag">Case study</div>
    <h1>Salesforce Org<br>Opportunity Sync</h1>
    <div class="sub">Real-time sync between two orgs, plus a working demo and an audit checklist</div>
    <div class="stats">
      <div class="stat"><b>7</b><span>chained stages</span></div>
      <div class="stat"><b>136</b><span>steps in total</span></div>
      <div class="stat"><b>13</b><span>defects found in audit</span></div>
    </div>
    <div class="flow"><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div><div class="dot d5"></div><div class="dot d6"></div></div>
    <div class="foot">Zapier &middot; JavaScript &middot; Salesforce &middot; n8n</div>
  </div>
</body>
</html>
